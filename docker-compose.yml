version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: streaming-db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streaming-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: streaming-client
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://server:4000
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: streaming-server
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      - MONGODB_URI=mongodb://mongo:27017/streaming
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=development
      - JWT_ACCESS_SECRET=your-super-secret-access-key-change-in-production-min-32-chars
      - JWT_REFRESH_SECRET=your-super-secret-refresh-key-change-in-production-min-32-chars
      - CLIENT_URL=http://localhost:5173
      - TMDB_API_KEY=1a68b0b3695c7a1b3d40e733f9216c0f
      - MIXDROP_EMAIL=abdallahalfeky18@gmail.com
      - MIXDROP_KEY=4EVGd13ASvIzitK4RW
      - IMGBB_API_KEY=b862099c9905e0f993edfc8a7c011e95
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
